<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Перевірка сертифіката | Вебінари ВАГ</title>
  <meta name="description" content="Перевірка справжності сертифіката учасника вебінару Всеукраїнської асоціації гідів." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { colors: { vagblue: '#0f2f5f', vaggreen: '#10b981', vaglight: '#f8fafc' } } } }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    :focus-visible { outline: 3px solid #10b981; outline-offset: 2px; border-radius: 6px; }
  </style>
</head>
<body class="bg-vaglight text-slate-800 min-h-screen flex flex-col">
  <nav class="border-b border-slate-200 bg-white">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-xl font-extrabold text-vagblue tracking-tighter">ВАГ <span class="text-vaggreen">WEBINARS</span></a>
      <a href="index.html#certificate" class="text-sm font-semibold text-slate-600 hover:text-vagblue">Отримати сертифікат</a>
    </div>
  </nav>

  <main class="flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 py-12">
    <p class="text-emerald-700 font-bold uppercase tracking-widest text-xs mb-3">Перевірка</p>
    <h1 class="text-3xl md:text-4xl font-extrabold text-slate-950 mb-3">Перевірка справжності сертифіката</h1>
    <p class="text-slate-600 mb-8">Введіть номер сертифіката, вказаний унизу документа (формат <code class="bg-slate-100 px-1 rounded">VAG-2026-XXXXXX</code>).</p>

    <form id="vForm" class="bg-white border border-slate-100 shadow-sm rounded-3xl p-6 flex flex-col sm:flex-row gap-3">
      <label class="flex-1"><span class="sr-only">Номер сертифіката</span>
        <input id="vId" required autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="VAG-2026-XXXXXX"
          class="w-full p-4 rounded-xl border border-slate-200 font-mono text-lg uppercase focus:outline-none focus:ring-2 focus:ring-emerald-400"></label>
      <button class="bg-vagblue hover:bg-vaggreen text-white font-extrabold px-8 py-4 rounded-xl transition">Перевірити</button>
    </form>

    <div id="vResult" class="mt-8" aria-live="polite"></div>
  </main>

  <footer class="border-t border-slate-200 bg-white">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 py-6 text-sm text-slate-500 flex flex-wrap justify-between gap-3"><span>© Всеукраїнська асоціація гідів</span><a href="https://academy.psgua.com/" class="underline hover:text-vagblue">Академія ВАГ — онлайн-курси</a></div>
  </footer>

  <script src="webinars-data.js?v=2026-10-19c"></script>
  <script src="academy-links.js?v=2026-11-20"></script>
  <script>
    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const box = (cls, html) => `<div class="rounded-3xl border p-6 md:p-8 ${cls}">${html}</div>`;

    async function verify(id) {
      id = id.trim().toUpperCase();
      $('#vId').value = id;
      const out = $('#vResult');
      if (!/^VAG-\d{4}-[A-Z0-9]{6}$/.test(id)) {
        const acad = (typeof ACADEMY !== 'undefined') ? ACADEMY : { url: 'https://academy.psgua.com/', verifyUrl: '' };
        out.innerHTML = box('bg-amber-50 border-amber-200', '<p class="font-bold text-amber-900">Це не номер сертифіката вебінару.</p><p class="text-amber-900 text-sm mt-1">Номери сертифікатів учасників вебінарів мають вигляд VAG-2026-K7M2QX.</p>' +
          '<p class="text-amber-900 text-sm mt-3"><b>Це сертифікат курсу Академії ВАГ?</b> Такі сертифікати видаються за завершення курсу, мають інший код і перевіряються ' +
          (acad.verifyUrl ? '<a class="underline font-bold" href="' + esc(acad.verifyUrl) + '">на сайті Академії</a>' : 'на сайті Академії') +
          ' або за запитом на <a class="underline" href="mailto:info@uaguides.com">info@uaguides.com</a>.</p>');
        return;
      }
      if (!CONFIG.FORM_ENDPOINT) {
        out.innerHTML = box('bg-amber-50 border-amber-200', '<p class="text-amber-900">Перевірка тимчасово недоступна.</p>');
        return;
      }
      out.innerHTML = '<p class="text-slate-500">Перевіряємо…</p>';
      try {
        const res = await fetch(CONFIG.FORM_ENDPOINT + '?verify=' + encodeURIComponent(id), { cache: 'no-store' });
        const text = await res.text();
        let d;
        try { d = JSON.parse(text); }
        catch {
          console.warn('[VAG] verify response:', text.slice(0, 1500));
          const hint = /doGet/i.test(text)
            ? 'На сервері стара версія скрипта (немає функції doGet). Організаторам: Apps Script → Розгорнути → Керувати розгортаннями → ✏️ → Нова версія.'
            : 'Сервер перевірки відповів не у тому форматі. Організаторам: перевірте, що розгортання доступне «Усім» і оновлене до нової версії.';
          const snippet = text.replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 300);
          out.innerHTML = box('bg-amber-50 border-amber-200', '<p class="font-bold text-amber-900">Перевірка тимчасово недоступна.</p><p class="text-amber-900 text-sm mt-2">' + esc(hint) + '</p>' +
            '<details class="mt-3 text-xs text-amber-900"><summary class="cursor-pointer">Технічні деталі (код ' + res.status + ')</summary><p class="mt-2 font-mono break-words">' + esc(snippet || 'порожня відповідь') + '</p></details>');
          return;
        }
        if (d.valid) {
          out.innerHTML = box('bg-emerald-50 border-emerald-200', `
            <p class="flex items-center gap-2 text-emerald-800 font-extrabold text-xl mb-4"><span aria-hidden="true">✅</span> Сертифікат дійсний</p>
            <dl class="grid sm:grid-cols-3 gap-x-6 gap-y-3 text-sm">
              <dt class="text-slate-500">Номер</dt><dd class="sm:col-span-2 font-mono font-bold">${esc(d.id)}</dd>
              <dt class="text-slate-500">Учасник</dt><dd class="sm:col-span-2 font-bold text-slate-900">${esc(d.name)}</dd>
              <dt class="text-slate-500">Вебінар</dt><dd class="sm:col-span-2">«${esc(d.webinar)}»</dd>
              <dt class="text-slate-500">Дата</dt><dd class="sm:col-span-2">${esc(d.date)}${d.hours ? ' • ' + esc(d.hours) : ''}</dd>
              <dt class="text-slate-500">Видав</dt><dd class="sm:col-span-2">${esc(d.issuer)}</dd>
              <dt class="text-slate-500">Дата видачі</dt><dd class="sm:col-span-2">${esc(d.issuedAt)}</dd>
            </dl>`);
        } else {
          out.innerHTML = box('bg-red-50 border-red-200', `
            <p class="flex items-center gap-2 text-red-800 font-extrabold text-xl mb-2"><span aria-hidden="true">⛔</span> Сертифікат не знайдено</p>
            <p class="text-red-900 text-sm">Перевірте номер. Якщо ви впевнені, що номер правильний, зверніться до організаторів ВАГ.</p>`);
        }
      } catch (e) {
        out.innerHTML = box('bg-amber-50 border-amber-200', '<p class="text-amber-900">Не вдалося з’єднатися з сервером перевірки. Спробуйте пізніше.</p>');
      }
    }

    $('#vForm').addEventListener('submit', e => { e.preventDefault(); verify($('#vId').value); });
    const fromUrl = new URLSearchParams(location.search).get('id');
    if (fromUrl) verify(fromUrl);
  </script>
</body>
</html>
